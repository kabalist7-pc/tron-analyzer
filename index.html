<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Tron Analyzer</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<h1>🎲 Tron Analyzer</h1>

<p>Analyse Provably Fair</p>

</header>

<main>

<section class="card">

<h2>Entrée</h2>

<input
id="pfLink"
type="text"
placeholder="Collez un lien Provably Fair">

<button onclick="analyse()">
Analyser
</button>

</section>

<section class="card">

<h2>Informations</h2>

<div class="row">
<span>Game</span>
<span id="game">-</span>
</div>

<div class="row">
<span>Nonce</span>
<span id="nonce">-</span>
</div>

<div class="row">
<span>Server Seed</span>
<span id="server">-</span>
</div>

<div class="row">
<span>Client Seed</span>
<span id="client">-</span>
</div>

<div class="row">
<span>Hash</span>
<span id="hash">-</span>
</div>

</section>

<section class="card">

<h2>Résultat</h2>

<div id="verification">

Prêt.

</div>

</section>

<section class="card">

<div class="history-header">

<h2>Historique</h2>

<span id="historyCounter">0 analyse</span>

</div>

<div id="history">

Aucune analyse enregistrée.

</div>

</section>

</main>

<script src="parser.js"></script>
<script src="crypto_engine.js"></script>
<script src="dice_engine.js"></script>
<script src="storage.js"></script>

<!-- Nouveau service -->
<script src="analysis_service.js"></script>

<script src="app.js"></script>

</body>

</html>
